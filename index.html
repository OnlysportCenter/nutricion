<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Onlysport Menús</title>
<meta name="description" content="Propuestas de menú saludable para socios de Onlysport Center">
<meta name="theme-color" content="#FFFFFF" id="metaTema">
<script>try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onlysport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: app de una columna (máx. 880px), cabecera fija con pestañas, tarjetas solo para cada comida y cada cliente */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --sunk:#EBEBE8; --ink:#121212; --muted:#5F5F5B; --line:#DBDBD7;
  --accent:#121212; --accent-ink:#FFFFFF; --accent-soft:#E7E7E3;
  --saffron:#B7740A; --saffron-soft:#FAEFD9;
  --good:#1F7A47; --bad:#B03F2A; --good-soft:#DCEFE3; --bad-soft:#F7E1DB;
  --c1:#2F6CB0; --c1-soft:#E2ECF7; --warn:#B7740A; --warn-soft:#FAEFD9;
  --f-display:"Poppins", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0C; --surface:#171717; --sunk:#111111; --ink:#F1F1EF; --muted:#A2A29D; --line:#2B2B29;
  --accent:#F1F1EF; --accent-ink:#0C0C0C; --accent-soft:#242422;
  --saffron:#ECB24C; --saffron-soft:#33280F;
  --good:#6FCF97; --bad:#EF8B74; --good-soft:#15301F; --bad-soft:#3A1E18; --c1:#6AA2E2; --c1-soft:#15253A; --warn:#ECB24C; --warn-soft:#33280F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --surface:#171717; --sunk:#111111; --ink:#F1F1EF; --muted:#A2A29D; --line:#2B2B29;
  --accent:#F1F1EF; --accent-ink:#0C0C0C; --accent-soft:#242422;
  --saffron:#ECB24C; --saffron-soft:#33280F;
  --good:#6FCF97; --bad:#EF8B74; --good-soft:#15301F; --bad-soft:#3A1E18; --c1:#6AA2E2; --c1-soft:#15253A; --warn:#ECB24C; --warn-soft:#33280F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:1.8rem;font-weight:700;line-height:1.15}
h2{font-size:1.3rem;font-weight:600;line-height:1.25}
h3{font-size:1.05rem;font-weight:600;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand .name{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.1rem;line-height:1}
.brand .name small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.mark svg{height:24px;width:auto}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.hero-logo{display:flex;justify-content:center;padding-block:8px 4px;color:var(--ink)}
.hero-logo svg{height:150px;width:auto}
.hero-logo img{max-height:150px;max-width:100%}
.who{font-size:.85rem;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
@media (max-width:440px){.who{display:none}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--saffron);color:var(--accent-ink);font-size:.72rem;line-height:18px;text-align:center}

main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:24px}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.notice{border-radius:12px;padding:14px 16px;background:var(--saffron-soft);display:flex;flex-direction:column;gap:6px}
.notice.ok{background:var(--accent-soft)}
.notice b{font-weight:700}

/* formularios */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.inp{font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.unit{position:relative}
.unit .inp{padding-right:44px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);height:100%}
.choice label small{color:var(--muted)}
.choice input:checked + label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip label{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.88rem;background:var(--surface)}
.chip input:checked + label{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.chip.pos input:checked + label{background:var(--accent-soft);border-color:var(--accent)}
.chip input:focus-visible + label{outline:2px solid var(--accent)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.err{color:var(--bad);font-size:.88rem}

/* menú */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.day small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.day[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day[aria-current="true"] small{color:var(--accent-ink);opacity:.8}
.day.today{border-color:var(--saffron)}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.macros > div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.macros b{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.macros span{font-size:.75rem;color:var(--muted)}
.macros .bar{padding:0;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.micon{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}
.micon svg{width:17px;height:17px;color:var(--accent)}
.meal.sup .micon svg{color:var(--saffron)}
.meal.sup .micon{background:var(--saffron-soft)}
.meal.libre{background:var(--saffron-soft);border-color:transparent}
.meal.libre .micon{background:var(--surface)} .meal.libre .micon svg{color:var(--saffron)}
.meal.libre .mtype{color:var(--saffron)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.nav{background:var(--bad-soft);color:var(--bad)}
.meal.dulce.xmas{border-top:3px solid var(--bad)}
.meal.dulce .micon{background:var(--bad-soft)} .meal.dulce .micon svg{color:var(--bad)}
.meal.dulce .mtype{color:var(--muted)}
.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.day.libre small{color:var(--saffron);font-weight:600}
.day.bloq{opacity:.55;border-style:dashed}
.day.bloq small{display:flex;align-items:center;gap:3px}
.meal.bloqueado{border-style:dashed;text-align:left}
.meal.bloqueado h3{display:flex;align-items:center;gap:8px}
.day.libre[aria-current="true"] small{color:var(--accent-ink)}
.tabs{mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
@media (min-width:700px){.tabs{mask-image:none;-webkit-mask-image:none}}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.meal header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mtype{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:500}
.mkcal{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.ings li:last-child{border-bottom:0}
.ings b{font-family:var(--f-mono);font-weight:500;font-size:.85rem;white-space:nowrap}
.prep{font-size:.9rem;color:var(--muted)}
.extras{font-size:.82rem;color:var(--muted)}
.meal .row{margin-top:auto}

/* compra */
.shop{columns:3 260px;column-gap:24px}
.shop section{break-inside:avoid;margin-bottom:22px}
.shop section{display:flex;flex-direction:column;gap:6px;min-width:0}
.shop h3{font-size:.95rem;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.item span{flex:1;min-width:0}
.item small{display:block;font-size:.76rem;color:var(--muted)}
.item .q{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.item b{font-family:var(--f-mono);font-weight:500;font-size:.85rem;white-space:nowrap}
.item em{font-style:normal;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
.shop h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.shop h3 .num{font-size:.85rem;font-weight:500}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.budget div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:2px}
.budget div:first-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.budget div:first-child span,.budget div:first-child small{color:var(--accent-ink);opacity:.85}
.budget span{font-size:.85rem;color:var(--muted)}
.budget b{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1}
.budget small{font-size:.78rem;color:var(--muted)}
.item.cambio{background:var(--saffron-soft);border-radius:8px;padding-left:8px;padding-right:8px;margin-inline:-8px}
.aviso-item{display:block;font-style:normal;font-size:.76rem;font-weight:700;color:var(--saffron)}
.item.done span,.item.done b,.item.done em{text-decoration:line-through;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* progreso */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--f-mono);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.d{display:block;font-family:var(--f-mono);font-size:.74rem}
.d.good{color:var(--good)} .d.bad{color:var(--bad)} .d.neu{color:var(--muted)}
.hero{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--tone)}
.hero.good{--tone:var(--good);--tone-soft:var(--good-soft)} .hero.bad{--tone:var(--bad);--tone-soft:var(--bad-soft)} .hero.warn{--tone:var(--warn);--tone-soft:var(--warn-soft)} .hero.neu{--tone:var(--c1);--tone-soft:var(--c1-soft)}
.status{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:5px 12px 5px 8px;border-radius:999px;background:var(--tone-soft);color:var(--tone);font-weight:700;font-size:.85rem}
.status svg{width:16px;height:16px}
.hero-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:16px}
.hero-nums div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-nums b{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-nums b.good{color:var(--good)} .hero-nums b.bad{color:var(--bad)} .hero-nums b.neu{color:var(--ink)}
.hero-nums span{font-size:.82rem;color:var(--muted)}
.dchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-family:var(--f-mono);font-size:.76rem;font-weight:500;white-space:nowrap}
.dchip.good{background:var(--good-soft);color:var(--good)} .dchip.bad{background:var(--bad-soft);color:var(--bad)} .dchip.neu{background:var(--sunk);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--c1);vertical-align:middle;margin-right:6px}
.legend i.ref{border-top:2px dashed var(--muted)}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:.8rem;line-height:1.3;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:2}
.tip b{font-family:var(--f-mono);font-weight:500}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.mini b{font-family:var(--f-display);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
.mini svg{width:100%;height:46px;display:block}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gauge b{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.scale{position:relative;display:flex;gap:2px;height:10px}
.scale span{border-radius:3px;flex:1}
.scale .z1{background:var(--c1-soft)} .scale .z2{background:var(--good)} .scale .z3{background:var(--warn)} .scale .z4{background:var(--bad)}
.scale .pin{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface);transform:translateX(-50%)}
.scale-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.zone{font-size:.85rem;font-weight:600}
.zone.good{color:var(--good)} .zone.warn{color:var(--warn)} .zone.bad{color:var(--bad)} .zone.neu{color:var(--c1)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}

function hash(s){let h=2166136261; for(const ch of s){h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0;}
function rng(seed){let a=seed; return ()=>{a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}

/* ===================== MOTOR NUTRICIONAL ===================== */
function ingNombre(key, pf){
  const z=ING[key]; const it=pf?.intolerancias||[];
  if(it.includes('gluten') && z.sg) return z.sg;
  if(it.includes('lactosa') && z.sl) return z.sl;
  return z.n;
}
function recetaPermitida(r, cli, relajar=false){
  const pf=cli.perfil||{}; const it=pf.intolerancias||[];
  const veto = pf.dieta==='vegano' ? ['carne','pescado','marisco','huevo','lacteo','miel'] : pf.dieta==='veg' ? ['carne','pescado','marisco'] : [];
  const palabras = norm(pf.noGustaTexto).split(/[\s,;.\/]+/).filter(w=>w.length>3);
  for(const [key] of r.i){
    const z=ING[key];
    for(const al of (z.a||[])){
      if(!it.includes(al)) continue;
      if(al==='gluten' && z.sg) continue;
      if(al==='lactosa' && z.sl) continue;
      return false;
    }
    if(z.d && veto.includes(z.d)) return false;
    if(z.sup && !(pf.suplementos||[]).includes(z.sup)) return false;
    if(!relajar && (pf.noGusta||[]).includes(key)) return false;
    if(!relajar && palabras.some(w=>norm(z.n).includes(w))) return false;
  }
  if(!relajar && (cli.rechazadas||[]).includes(r.id)) return false;
  if(!relajar && palabras.some(w=>norm(r.n).includes(w))) return false;
  return true;
}
function elegibles(cli){
  const out={};
  for(const t of TIPOS){
    let l=REC.filter(r=>r.t===t && recetaPermitida(r,cli));
    if(l.length<2) l=REC.filter(r=>r.t===t && recetaPermitida(r,cli,true));
    out[t]=l;
  }
  return out;
}
function ultimaMed(cli){ const m=cli.mediciones||[]; return m[m.length-1]; }
function objetivoNutricional(cli){
  const pf=cli.perfil; const peso=ultimaMed(cli).peso;
  const bmr = 10*peso + 6.25*pf.altura - 5*pf.edad + (pf.sexo==='H'?5:-161);
  // Actividad: sesiones de 1 hora; 5-6 días cuentan como actividad alta, no muy alta
  const e=pf.entrenos; let fa = e<=0?1.2 : e<=2?1.375 : e<=4?1.55 : e<=6?1.65 : 1.75;
  fa += pf.trabajo==='fisico'?0.1 : pf.trabajo==='pie'?0.05 : 0;
  const tdee = bmr*fa; const o=OBJETIVOS[pf.objetivo];
  let kcal = tdee*(1+o.adj) + (pf.ajusteKcal||0);
  const suelo = pf.sexo==='H'?1500:1200;
  kcal = Math.max(suelo, Math.round(kcal/10)*10);
  // Con sobrepeso, proteína y grasa mínima sobre un peso de referencia (el de un IMC de 25), no sobre el peso total
  const pesoRef = Math.min(peso, 25*(pf.altura/100)**2);
  const prot = Math.round(o.pk*pesoRef);
  const grasa = Math.round(Math.max(0.8*pesoRef, 0.27*kcal/9));
  const hc = Math.max(0, Math.round((kcal - prot*4 - grasa*9)/4));
  return {kcal, prot, grasa, hc, bmr:Math.round(bmr), tdee:Math.round(tdee)};
}
const PERIODOS={1:'cada semana',2:'cada dos semanas',3:'cada tres semanas',4:'cada cuatro semanas'};
function diasPlan(plan){ return plan?.dias?.length || 14; }
function semanasPlan(plan){ return Math.max(1, Math.round(diasPlan(plan)/7)); }
function proxRevision(plan){ return addDays(plan.inicio, diasPlan(plan)); }
function semanaHoy(plan){ return Math.min(semanasPlan(plan)-1, Math.max(0, Math.floor(diffDays(plan.inicio,hoy())/7))); }
function periodoCentro(){ return +(S.centro?.periodo) || 2; }
function periodoDe(id, c){ const ap = id===S.uid ? miAprob() : aprobValida(S.aprobs?.[id], c); return +(ap?.periodo) || periodoCentro(); }
function miPeriodo(){ return periodoDe(S.uid, S.cli); }
// Parte de las calorías de un plato que viene de la proteína
function densProt(r){ let p=0; for(const [key,g] of r.i) p+=(ING[key].p||0)*g/100; return p*4/Math.max(1,r.k); }
function generarPlan(cli, inicio, semilla, semanas=2){
  const obj = objetivoNutricional(cli); const el = elegibles(cli);
  const rand = rng(hash(semilla));
  const densObj = obj.prot*4/obj.kcal;
  const orden = {}; const pos = {};
  for(const t of TIPOS){ orden[t]=shuffle(el[t].map(r=>r.id), rand); pos[t]=0; }
  const dias=[];
  for(let d=0; d<7*Math.max(1,Math.min(4,semanas||2)); d++){
    const dia={};
    for(const t of TIPOS){
      const l=orden[t]; if(!l.length){ dia[t]=null; continue; }
      const fijo=cli.perfil?.fijos?.[t];
      if(fijo && RECMAP[fijo] && recetaPermitida(RECMAP[fijo],cli,true)){ dia[t]=fijo; continue; }
      // Entre los 3 siguientes platos de la rotación, el que mejor encaja con la proteína que pide el objetivo
      // (la cena, además, con un ingrediente principal distinto al de la comida). Así se mantiene la variedad.
      const prin = rid => RECMAP[rid].i[0][0];
      const k0=pos[t]%l.length; let mejor=k0, mejorS=-1e9;
      for(let j=0;j<Math.min(3,l.length);j++){
        const k=(pos[t]+j)%l.length, r=RECMAP[l[k]];
        const rep = t==='cena' && dia.comida && l.length>2 && prin(l[k])===prin(dia.comida);
        const dv=densProt(r)-densObj, s=(dv<0?2*dv:-0.5*dv) - (rep?1:0) - j*0.004;
        if(s>mejorS){ mejorS=s; mejor=k; }
      }
      [l[k0],l[mejor]]=[l[mejor],l[k0]];
      const id=l[k0]; pos[t]++;
      dia[t]=id;
    }
    dias.push(dia);
  }
  return {inicio, ...obj, pesoRef:ultimaMed(cli).peso, dias, creado:new Date().toISOString()};
}
function factorComida(r, kcalDia, t){ return Math.min(1.9, Math.max(0.6, kcalDia*REPARTO[t]/r.k)); }
// Objetivo de calorías del día: el total, menos la parte de la comida libre si ese día la hay
function objetivoDia(plan,d,pf){
  if(diaLibre(plan,d,pf) && libreDe(pf).tipo==='dia') return 0;
  let k=plan.kcal; for(const t of TIPOS) if(esLibre(plan,d,t,pf)) k-=plan.kcal*REPARTO[t];
  return Math.round(k);
}
// Raciones de TODAS las comidas del día ajustadas a la vez, para que el total cuadre con el objetivo
const F_MIN=0.45, F_MAX=2.6;
const fClamp=x=>Math.min(F_MAX, Math.max(F_MIN, x));
function kcalRacion(r,f){ let k=0; for(const [key,g] of r.i) k+=ING[key].k*redondear(key,g*f).g/100; return k; }
function factoresDia(plan,d,pf){
  const meals=recetasDelDia(plan,d,pf); const F={}; if(!meals.length) return F;
  const target=objetivoDia(plan,d,pf); const share=meals.reduce((a,[t])=>a+REPARTO[t],0);
  for(const [t,r] of meals) F[t]=fClamp(target*REPARTO[t]/share/r.k);
  const total=()=>meals.reduce((a,[t,r])=>a+kcalRacion(r,F[t]),0);
  let best={...F}, bestErr=Math.abs(target-total());

    const diff=target-total();
    const mov=meals.filter(([t])=> diff>0 ? F[t]<F_MAX-1e-6 : F[t]>F_MIN+1e-6); if(!mov.length) break;

    for(const [t] of mov) F[t]=fClamp(F[t]*(1+0.85*diff/base));
    const e=Math.abs(target-total()); if(e<bestErr){ bestErr=e; best={...F}; }
  }
  Object.assign(F,best);
  // 2) Ajuste fino: mover una comida cada vez en pasos pequeños mientras mejore
  for(let it=0; it<24 && bestErr>target*0.01; it++){
    let mejora=null;
    for(const [t] of meals) for(const paso of [0.04,-0.04,0.1,-0.1]){

      if(e<bestErr-0.5 && (!mejora||e<mejora.e)) mejora={t,v:F[t],e}; F[t]=prev;
    }
    if(!mejora) break; F[mejora.t]=mejora.v; bestErr=mejora.e;
  }
  return F;
}
function redondear(key,g){
  const z=ING[key];
  if(z.u==='ud'){ const u=Math.max(1,Math.round(g/z.ug)); return {txt:u+' '+(u===1?z.un[0]:z.un[1]), g:u*z.ug}; }
  const step = g<30?5:10; const v=Math.max(step,Math.round(g/step)*step);
  if(key==='aceite'){ const c=v/10; return {txt:v+' g · '+(c<1?'1 cdta':fmtN(c,1)+' cda'), g:v}; }
  return {txt:v+(z.u==='ml'?' ml':' g'), g:v};
}
const fmtEur = n => n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const DIAS_SEM=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function libreDe(pf){ const l=pf?.libre; return (l && l.dia!=null && l.dia!=='no') ? {dia:+l.dia, tipo:l.tipo||'comida'} : null; }
function esLibre(plan,d,t,pf){ const l=libreDe(pf); if(!l) return false; return parseISO(addDays(plan.inicio,d)).getDay()===l.dia && (l.tipo==='dia' || l.tipo===t); }
function diaLibre(plan,d,pf){ const l=libreDe(pf); return !!l && parseISO(addDays(plan.inicio,d)).getDay()===l.dia; }
function textoLibre(pf){ const l=libreDe(pf); if(!l) return 'Sin comida libre'; return (l.tipo==='dia'?'Día libre':l.tipo==='cena'?'Cena libre':'Comida libre')+' los '+DIAS_SEM[l.dia]+(l.dia===6||l.dia===0?'s':''); }
function recetasDelDia(plan,d,pf){ return TIPOS.filter(t=>!esLibre(plan,d,t,pf)).map(t=>[t, RECMAP[plan.dias[d][t]]]).filter(([,r])=>r); }
function totalesDia(plan, d, pf){
  let k=0,P=0,C=0,F=0; const FD=factoresDia(plan,d,pf);
  for(const [t,r] of recetasDelDia(plan,d,pf)){
    const f=FD[t];
    for(const [key,g] of r.i){ const gg=redondear(key,g*f).g; const z=ING[key]; k+=z.k*gg/100; P+=z.p*gg/100; C+=z.c*gg/100; F+=z.f*gg/100; }
  }
  return {k:Math.round(k),P:Math.round(P),C:Math.round(C),F:Math.round(F)};
}
// Cuánto se compra y cuánto cuesta: envases completos, o a granel redondeando a 100 g; la despensa cuenta solo lo que se gasta
const PRECIOS_FECHA_DEF='2026-10-28';
function precioDe(key){ const v=S.centro?.precios?.[key]; return (typeof v==='number' && v>=0) ? v : ING[key].pr; }
function verPrecios(){ return S.centro?.mostrarPrecios===true; }
function fechaPrecios(){ return S.centro?.preciosFecha || PRECIOS_FECHA_DEF; }
function compraDe(key,g){
  const z={...ING[key], pr:precioDe(key)};
  if(z.kg){ const kg=Math.max(0.1, Math.ceil(g/100)/10); return {compra:'≈ '+fmtN(kg,1)+' kg a granel', caja:kg*z.pr, uso:g/1000*z.pr}; }
  const uso=g/z.pk*z.pr;
  if(z.prop) return {compra: verPrecios() ? 'de la despensa ('+z.pd+' a '+fmtEur(z.pr)+')' : 'de la despensa ('+z.pd+')', caja:uso, uso, prop:true};
  const n=Math.max(1, Math.ceil(g/z.pk-0.1));
  return {compra:(n===1?'1 ':n+' × ')+z.pd, caja:n*z.pr, uso};
}
function listaCompra(plan, semana, pf){
  const acc={}; const extras=new Set();
  for(let d=semana*7; d<semana*7+7; d++){
    if(diaBloqueado(plan,d)) continue;
    const FD=factoresDia(plan,d,pf);
    for(const [t,r] of recetasDelDia(plan,d,pf)){
      const f=FD[t];
      for(const [key,g] of r.i) acc[key]=(acc[key]||0)+redondear(key,g*f).g;
      r.x.forEach(x=>extras.add(x));
    }
  }
  const dul=(S.cli?.postres||[]).filter(x=>x.plan===plan.creado && x.sem===semana && POSTREMAP[x.id]);
  for(const x of dul) for(const [key,g] of POSTREMAP[x.id].i) acc[key]=(acc[key]||0)+g;
  for(const x of dul) POSTREMAP[x.id].casa.forEach(e=>extras.add(e));
  if((pf?.suplementos||[]).includes('creatina')) acc.creatina=dosisCreatina({mediciones:[{peso:plan.pesoRef||75}]})*7;
  const grupos={}; let total=0, consumo=0; const sub={};
  for(const [key,g] of Object.entries(acc)){
    const z=ING[key]; let txt;
    if(z.u==='ud'){ const u=Math.ceil(g/z.ug-0.05); txt=u+' '+(u===1?z.un[0]:z.un[1]); }
    else if(z.u==='ml') txt = g>=1000 ? fmtN(Math.ceil(g/250)*250/1000,2)+' L' : (Math.ceil(g/50)*50)+' ml';
    else txt = g>=1000 ? fmtN(Math.ceil(g/50)*50/1000,2)+' kg' : (Math.ceil(g/10)*10)+' g';
    const c=compraDe(key,g); total+=c.caja; consumo+=c.uso; sub[z.s]=(sub[z.s]||0)+c.caja;
    (grupos[z.s] ||= []).push({key, n:ingNombre(key,pf), txt, g, ...c});
  }
  for(const k in grupos) grupos[k].sort((a,b)=>a.n.localeCompare(b.n,'es'));
  return {grupos, sub, total, consumo, dulces:dul.map(x=>POSTREMAP[x.id].n), extras:[...extras].sort((a,b)=>a.localeCompare(b,'es'))};
}
function evaluarRevision(cli, nueva){
  const m=cli.mediciones||[]; const prev=m[m.length-1]; const pf=cli.perfil;
  const dias=Math.max(7, diffDays(prev.fecha, nueva.fecha)); const sem=dias/7;
  const ritmo = ((nueva.peso-prev.peso)/prev.peso*100)/sem; // % por semana
  const dCint = nueva.cintura-prev.cintura;
  let delta=0, nota='';
  const o=pf.objetivo;
  if(o==='perder_peso' || o==='perder_grasa'){
    const perdida=-ritmo;
    if(perdida>1.0){ delta=+150; nota='Estás bajando más rápido de lo recomendable. Subimos un poco la energía para proteger el músculo.'; }
    else if(perdida<0.25 && !(o==='perder_grasa' && dCint<=-1)){ delta=-150; nota='El peso apenas se ha movido. Bajamos un poco las calorías para reactivar el progreso.'; }
    else nota = (o==='perder_grasa' && dCint<=-1 && perdida<0.25) ? 'La báscula se mueve poco pero la cintura baja: estás perdiendo grasa. Mantenemos el plan.' : 'Vas a buen ritmo. Mantenemos las calorías.';
  } else if(o==='volumen'){
    if(ritmo<0.1){ delta=+150; nota='No estás subiendo de peso. Añadimos algo más de energía.'; }
    else if(ritmo>0.6 || dCint>=2){ delta=-100; nota='Estás subiendo demasiado rápido. Ajustamos para que sea más músculo y menos grasa.'; }
    else nota='Ganas peso a buen ritmo. Mantenemos el plan.';
  } else {
    const tot=(nueva.peso-prev.peso)/prev.peso*100;
    if(tot>1.5){ delta=-150; nota='Has subido algo de peso. Ajustamos para mantenerte.'; }
    else if(tot<-1.5){ delta=+150; nota='Has bajado algo de peso. Subimos un poco la energía para mantenerte.'; }
    else nota='Te mantienes estable. Seguimos igual.';
  }
  return {delta, nota};
}

const CFG = window.ONLYSPORT_CONFIG || {};
let sb = null;
const loaders = {}; // tabla -> Set(funciones de recarga)
function registrar(tabla, fn){ (loaders[tabla] ||= new Set()).add(fn); return ()=>loaders[tabla].delete(fn); }
function refrescar(tabla){ (loaders[tabla]||[]).forEach(fn=>fn()); }
function errorTxt(e){ return (e && (e.message||e.error_description||e.msg)) || String(e||''); }

function docRef(path){
  const [tabla,id]=path.split('/');
  const ref={
    async get(){ const {data,error}=await sb.from(tabla).select('data').eq('id',id).maybeSingle(); if(error) throw error; return {exists:!!data, data:()=>data?.data}; },
    async set(d){ const {error}=await sb.from(tabla).upsert({id, data:d}); if(error) throw error; refrescar(tabla); },
    async update(p){
      if(tabla==='clientes'){ const {error}=await sb.rpc('patch_cliente',{cid:id, p}); if(error) throw error; }
      else { const cur=(await ref.get()).data()||{}; const {error}=await sb.from(tabla).upsert({id, data:{...cur,...p}}); if(error) throw error; }
      refrescar(tabla);
    },
    async delete(){ const {error}=await sb.from(tabla).delete().eq('id',id); if(error) throw error; refrescar(tabla); },
    onSnapshot(next, onErr){
      const load=async()=>{ try{ next(await ref.get()); }catch(e){ onErr&&onErr(e); } };
      load(); const off=registrar(tabla, load);
      const ch=sb.channel('d:'+path+':'+Math.random().toString(36).slice(2))
        .on('postgres_changes',{event:'*',schema:'public',table:tabla,filter:'id=eq.'+id},()=>load()).subscribe();
      return ()=>{ off(); sb.removeChannel(ch); };
    }
  };
  return ref;
}
function colRef(tabla){
  return { onSnapshot(next){
    let t; const load=async()=>{ const {data}=await sb.from(tabla).select('id,data'); next({docs:(data||[]).map(r=>({id:r.id, data:()=>r.data}))}); };
    const deb=()=>{ clearTimeout(t); t=setTimeout(load,250); };
    load(); const off=registrar(tabla, deb);
    const ch=sb.channel('c:'+tabla+':'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:tabla},deb).subscribe();
    return ()=>{ off(); sb.removeChannel(ch); };
  }};
}

      return;
    }
    if(f.id==='fSignup'){
      const n=$('#rNombre').value.trim(), a=$('#rApellidos').value.trim(), p=$('#aPass').value, p2=$('#aPass2').value;
      if(!n||!a) return err.textContent='Escribe tu nombre y apellidos.';
      if(!okMail) return err.textContent='Revisa el correo electrónico.';
      if(p.length<8) return err.textContent='La contraseña debe tener al menos 8 caracteres.';
      if(p!==p2) return err.textContent='Las contraseñas no coinciden.';
      const cons=leerConsentimiento('#aErr'); if(!cons) return;
      btn.disabled=true;
      const {data,error}=await sb.auth.signUp({email, password:p, options:{emailRedirectTo:redir, data:{registro:{nombre:n, apellidos:a, interes:leerInteres(), ...cons}}}});
      if(error) throw error;
      if(data?.user && Array.isArray(data.user.identities) && data.user.identities.length===0) throw new Error('already registered');
      if(!data.session){ S.auth='enviado'; render(); }
      return;
    }
    if(f.id==='fRecuperar'){
      if(!okMail) return err.textContent='Revisa el correo electrónico.';
      btn.disabled=true; const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redir}); if(error) throw error;
      S.auth='recuperado'; render(); return;
    }
    if(f.id==='fNueva'){
      const p=$('#aPass').value, p2=$('#aPass2').value;
      if(p.length<8) return err.textContent='La contraseña debe tener al menos 8 caracteres.';
      if(p!==p2) return err.textContent='Las contraseñas no coinciden.';
      btn.disabled=true; const {error}=await sb.auth.updateUser({password:p}); if(error) throw error;
      history.replaceState(null,'',location.pathname); toast('Contraseña guardada');
      S.auth='login'; const {data:{session}}=await sb.auth.getSession(); if(session) arrancar(session); else render();
      return;
    }
  }catch(e){ if(err) err.textContent=traducir(e); }
  finally{ if(btn) btn.disabled=false; }
}

const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const instalada = () => window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone===true;
function pushSoportado(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64aUint8(b){ const p='='.repeat((4-b.length%4)%4); const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function swReg(){ if(!('serviceWorker' in navigator)) return null; try{ return await navigator.serviceWorker.register('sw.js'); }catch(e){ console.warn(e); return null; } }
S.pushEstado='?';
async function revisarSuscripcion(){
  if(!pushSoportado()){ S.pushEstado = esIOS && !instalada() ? 'ios' : 'no'; return; }
  if(Notification.permission==='denied'){ S.pushEstado='bloqueado'; return; }
  const reg=await swReg(); const sub=await reg?.pushManager.getSubscription();
  S.pushEstado = sub ? 'on' : 'off';
  if(sub && S.uid) sb.from('push_subs').upsert({endpoint:sub.endpoint, user_id:S.uid, sub:sub.toJSON()}).then(()=>{});

async function activarAvisos(){
  if(!pushSoportado()){ toast(esIOS?'En iPhone, primero añade la app a la pantalla de inicio.':'Este navegador no admite notificaciones.'); return; }
  if(!S.pushKey){ const {data}=await sb.from('config').select('data').eq('id','push').maybeSingle(); S.pushKey=data?.data?.publicKey; }
  if(!S.pushKey){ toast('Las notificaciones aún no están listas. Avisa al centro.'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ S.pushEstado = perm==='denied'?'bloqueado':'off'; render(); return; }
  try{
    const reg=await swReg(); await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64aUint8(S.pushKey)});
    const {error}=await sb.from('push_subs').upsert({endpoint:sub.endpoint, user_id:S.uid, sub:sub.toJSON()}); if(error) throw error;
    S.pushEstado='on'; toast('Notificaciones activadas en este dispositivo'); render();
  }catch(e){ console.error(e); toast('No se han podido activar las notificaciones.'); }
}
async function desactivarAvisos(){
  try{ const reg=await swReg(); const sub=await reg?.pushManager.getSubscription(); if(sub){ await sb.from('push_subs').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); } }catch{}
  S.pushEstado='off'; toast('Notificaciones desactivadas en este dispositivo'); render();
}

const MEDIDA_INFO = {
  pecho:{n:'Pecho', y:116, rx:37, cx:100, txt:'Pasa la cinta por la espalda y por delante a la altura de los pezones, por debajo de las axilas. Brazos relajados a los lados. Mide después de soltar el aire, sin hinchar el pecho.'},

  pierna:{n:'Pierna (muslo)', y:258, rx:16, cx:83, txt:'Muslo derecho, en la parte más ancha, justo por debajo del glúteo. De pie, con el peso repartido en las dos piernas y la pierna relajada.'},

function figuraMedidas(activa){
  const half=[[90,66],[66,76],[58,84],[62,116],[72,150],[73,170],[67,198],[64,214],[66,262],[73,318],[71,352],[78,396],[70,408],[93,408],[93,396],[94,350],[95,318],[97,262],[100,240]];
  const der=half.slice().reverse().map(([x,y])=>[200-x,y]);
  const pts=[...half,...der];
  const curva=p=>{ let d=`M${p[0][0]},${p[0][1]}`; for(let i=1;i<p.length;i++){ const [x0,y0]=p[i-1],[x1,y1]=p[i]; const mx=(x0+x1)/2,my=(y0+y1)/2; d+=` Q${x0},${y0} ${mx},${my}`; } return d+` L${p[p.length-1][0]},${p[p.length-1][1]} Z`; };
  const brazo=s=>{ const m=([x,y])=>[s<0?x:200-x,y]; const p=[[60,82],[48,96],[42,140],[38,190],[36,214],[44,220],[50,192],[54,146],[60,118]].map(m); return curva(p); };
  const cinta=(k)=>{ const c=MEDIDA_INFO[k], on=k===activa, ry=Math.max(4,c.rx*0.16);
    const col=on?'var(--c1)':'var(--muted)', op=on?1:.18, w=on?3:1.4;
    return `<g opacity="${op}"><path d="M${c.cx-c.rx},${c.y} A${c.rx},${ry} 0 0 1 ${c.cx+c.rx},${c.y}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="4 4"/>
      <path d="M${c.cx-c.rx},${c.y} A${c.rx},${ry} 0 0 0 ${c.cx+c.rx},${c.y}" fill="none" stroke="${col}" stroke-width="${w}"/>
      ${on?`<circle cx="${c.cx+c.rx}" cy="${c.y}" r="4" fill="var(--c1)"/><line x1="${c.cx+c.rx+4}" y1="${c.y}" x2="${k==='pierna'?150:158}" y2="${c.y}" stroke="var(--c1)" stroke-width="1.5"/><text x="${k==='pierna'?152:160}" y="${c.y+4}" font-size="12" font-weight="700" font-family="var(--f-body)" fill="var(--ink)">${c.n.split(' ')[0]}</text>`:''}</g>`; };
  return `<svg viewBox="0 0 220 420" role="img" aria-label="Dónde medir ${MEDIDA_INFO[activa].n.toLowerCase()}">
    <g fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round">
      <path d="${brazo(-1)}"/><path d="${brazo(1)}"/>
      <path d="${curva(pts)}"/>
      <rect x="91" y="50" width="18" height="20" rx="6"/>
      <circle cx="100" cy="32" r="21"/>
    </g>
    ${['pecho','cintura','cadera','pierna'].filter(k=>k!==activa).map(cinta).join('')}${cinta(activa)}
  </svg>`;
}

function postrePermitido(p,c){

  for(const [key] of p.i){ const z=ING[key];
    for(const al of (z.a||[])){ if(!it.includes(al)) continue; if(al==='gluten'&&z.sg) continue; if(al==='lactosa'&&z.sl) continue; return false; }
    if(z.d && veto.includes(z.d)) return false; }
  return true;
}

function sparkline(vals,cls){

function gauge(titulo,valor,txtValor,cortes,min,max,zonas,etiquetas,nota){

async function guardarMedicion(){
  const c=S.cli; const g=id=>parseFloat(($('#m_'+id).value||'').replace(',','.'));
  const fecha=$('#m_fecha').value||hoy();
  const lim={peso:[35,250],cintura:[40,200],cadera:[50,200],pierna:[25,120],pecho:[50,200]};
  const nueva={fecha};
  for(const [k,l] of MET){ const v=g(k); if(isNaN(v)||v<lim[k][0]||v>lim[k][1]){ $('#mErr').textContent=`${l}: introduce un valor entre ${lim[k][0]} y ${lim[k][1]}.`; return; } nueva[k]=r1(v); }
  const ult=ultimaMed(c);
  if(fecha<ult.fecha){ $('#mErr').textContent='La fecha no puede ser anterior a tu última medición.'; return; }
  const ev=evaluarRevision(c,nueva);
  const perfil={...c.perfil, ajusteKcal:(c.perfil.ajusteKcal||0)+ev.delta};
  const mediciones=[...c.mediciones.filter(x=>x.fecha!==fecha), nueva];
  const tmp={...c, perfil, mediciones};
  const plan=generarPlan(tmp, fecha, S.uid+fecha+mediciones.length, miPeriodo());
  const revisiones=[...(c.revisiones||[]), {fecha, delta:ev.delta, nota:ev.nota, kcal:plan.kcal}].slice(-30);
  if(await guardarCli({perfil, mediciones, plan, revisiones})){ S.medForm=false; S.dia=null; toast('Medidas guardadas. Tu nuevo menú está listo.'); }
}

function cliPorId(id){ return S.clientes.find(c=>c.id===id); }

async function registrarPago(id, tipo, cambio=false){
  const c=cliPorId(id); let ap=aprobValida(S.aprobs[id],c)||{}; let viejo=null;
  // Cambiar el último pago: se parte de cómo estaba el socio antes de ese pago
  if(cambio){ viejo=(ap.pagos||[]).slice(-1)[0]; if(!viejo) return; ap={...ap, tipo:viejo.prev.tipo, desde:viejo.prev.desde, hasta:viejo.prev.hasta, activo:viejo.prev.activo??false, pagos:ap.pagos.slice(0,-1)}; }
  const a=acceso(ap), t=tipo==='oferta' ? tarifaOferta() : tarifas().find(x=>x.id===tipo); if(!t) return;
  const desde = viejo ? viejo.desde : (a.k==='activo' && ap.hasta) ? addDays(ap.hasta,1) : hoy();
  const hasta = addDays(addMonths(desde, +t.meses), -1);
  const pago={fecha:viejo?viejo.fecha:hoy(), tipo, importe:+t.precio, desde, hasta, prev:viejo?viejo.prev:{tipo:ap.tipo||null, desde:ap.desde||null, hasta:ap.hasta||null, activo:ap.activo??null}};
  const ini = viejo ? (viejo.prev.activo&&viejo.prev.desde&&viejo.prev.hasta&&viejo.prev.hasta>=hoy() ? viejo.prev.desde : desde) : (a.k==='activo'&&ap.desde?ap.desde:desde);
  const msg = `${viejo?'Pago cambiado':'Pago registrado'}: ${t.n}, hasta el ${fmtFecha(hasta,{day:'numeric',month:'long',year:'numeric'})}`;
  if(await setAprob(id,{activo:true, tipo, desde:ini, hasta, pagos:[...(ap.pagos||[]), pago].slice(-30)}, msg)){
    S.pago=null; S.pagoCambio=false;
    const delta=(tipo==='oferta'?1:0)-(viejo?.tipo==='oferta'?1:0);
    if(delta){ const o=oferta(); await guardarCentro({oferta:{...o, usadas:Math.max(0,(+o.usadas||0)+delta)}}, delta>0?`${msg}. Plazas de la oferta que quedan: ${Math.max(0,ofertaQuedan()-1)}`:`${msg}. Plaza de la oferta devuelta`); }
    if(c?.renovacion){ try{ await S.db.doc('clientes/'+id).update({renovacion:null}); }catch(e){} }
  }
}
async function deshacerPago(id){
  const c=cliPorId(id), ap=aprobValida(S.aprobs[id],c); const p=(ap?.pagos||[]).slice(-1)[0]; if(!p) return;

async function setAprob(id, patch, okMsg){

  if(patch.activo!==undefined) data.fecha=new Date().toISOString();

}

function reducirImagen(file){
  return new Promise((res,rej)=>{ const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error('jpeg')),'image/jpeg',0.82); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; img.src=u; });
}

/* ---------- Asistente de preguntas (IA) ---------- */
function asistenteOn(){ return S.centro?.asistente===true; }
function asistenteVisible(){ return asistenteOn() || !!S.admin; }
const DIAS_N=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function contextoAsistente(){
  const c=S.cli, pf=c.perfil||{}, plan=c.plan, u=(c.mediciones||[]).slice(-1)[0]||{};
  const L=[];
  L.push(`Nombre: ${c.nombre}`);
  L.push(`Objetivo: ${OBJETIVOS[pf.objetivo]?.n||pf.objetivo}. ${pf.sexo==='H'?'Hombre':'Mujer'}, ${pf.edad} años, ${pf.altura} cm, ${u.peso??'?'} kg. Entrena ${pf.entrenos} días por semana.`);
  L.push(`Dieta: ${DIETAS[pf.dieta]?.n||'Como de todo'}. Intolerancias o alergias: ${(pf.intolerancias||[]).map(k=>INTOL[k]||k).join(', ')||'ninguna'}.`);
  L.push(`No le gusta: ${[...(pf.noGusta||[]).map(k=>ING[k]?.n||k), pf.noGustaTexto].filter(Boolean).join(', ')||'nada indicado'}.`);
  L.push(`Suplementos: ${(pf.suplementos||[]).join(', ')||'ninguno'}.`);
  const lib=libreDe(pf); L.push(`Comida libre: ${lib?`los ${DIAS_N[lib.dia]} (${lib.tipo==='dia'?'todo el día':lib.tipo})`:'no tiene'}.`);
  L.push(`Objetivo diario del menú: ${plan.kcal} kcal y ${plan.prot} g de proteína. Las cantidades son en crudo salvo legumbres de bote.`);
  const h=indiceHoy(plan), n=diasPlan(plan);
  const uv=ultimoDiaVisible(plan);
  for(let d=Math.max(0,h-1); d<n && (uv==null || d<=uv); d++){
    const det=d>=h && d<=h+2, FD=factoresDia(plan,d,pf);
    L.push(`\n## ${fmtFecha(addDays(plan.inicio,d),{weekday:'long',day:'numeric',month:'long'})}${d===h?' (HOY)':d===h+1?' (MAÑANA)':d===h-1?' (AYER)':''}`);
    if(diaLibre(plan,d,pf) && lib?.tipo==='dia'){ L.push('- Día libre: come lo que le apetezca.'); continue; }
    for(const ti of TIPOS){
      if(esLibre(plan,d,ti,pf)){ L.push(`- ${TIPO_LABEL[ti]}: comida libre`); continue; }
      const r=RECMAP[plan.dias[d]?.[ti]]; if(!r) continue;
      if(!det){ L.push(`- ${TIPO_LABEL[ti]}: ${r.n}`); continue; }
      let k=0; const ings=r.i.map(([key,g])=>{ const x=redondear(key,g*FD[ti]); k+=ING[key].k*x.g/100; return `${ingNombre(key,pf)} ${x.txt}`; }).join('; ');
      L.push(`- ${TIPO_LABEL[ti]} (${Math.round(k)} kcal): ${r.n}. Ingredientes: ${ings}. Preparación: ${r.p}${r.x.length?` Además: ${r.x.join(', ')}.`:''}`);
    }
  }
  return L.join('\n');
}

function fmtChat(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,'').replace(/^[-*]\s+/gm,'• ').replace(/\n/g,'<br>'); }

async function enviarPregunta(q){
  q=String(q||'').trim(); if(q.length<2 || S.chatEnv) return;
  const L=chatLeer(); const hist=L.filter(m=>!m.err).slice(-6).map(m=>({r:m.r,t:m.t}));
  L.push({r:'u',t:q}); S.chatBorr=''; S.chatEnv=true; S.chatBajar=true; render();
  let res;
  try{
    const {data,error}=await sb.functions.invoke('asistente',{body:{pregunta:q, historial:hist, contexto:contextoAsistente()}});
    if(error){ let j={}; try{ j=await error.context.json(); }catch{} res={error:j.error||'red', limite:j.limite}; } else res=data||{};
  }catch(e){ res={error:'red'}; }
  S.chatEnv=false;
  if(res.respuesta){ L.push({r:'a',t:res.respuesta}); S.chatQuedan=res.quedan; }
  else { if(res.error==='limite') S.chatQuedan=0; } if(!res.respuesta) L.push({r:'a',err:true,t:res.error==='limite'?`Has llegado al límite de ${res.limite||''} preguntas de hoy. Mañana puedes seguir preguntando.`:(ERR_IA[res.error]||'No se ha podido enviar la pregunta. Revisa tu conexión e inténtalo de nuevo.')});
  S.chat=L.slice(-40); store.set('chat_'+S.uid,S.chat); S.chatBajar=true; render();
}

document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target; const btn=f.querySelector('button.primary');
  if(['fLogin','fSignup','fRecuperar','fNueva'].includes(f.id)){ await enviarAuth(f, btn); return; }
  if(f.id==='fReg'){
    const n=$('#rNombre').value.trim(), a=$('#rApellidos').value.trim(), m=S.email;
    if(!n||!a) return $('#rErr').textContent='Escribe tu nombre y apellidos.';
    const cons=leerConsentimiento('#rErr'); if(!cons) return;
    btn.disabled=true;
    if(!(await guardarCli({nombre:n, apellidos:a, email:m, creado:new Date().toISOString(), interes:leerInteres(), ...cons}, true))) btn.disabled=false;
    return;
  }
  if(f.id==='fWiz'){
    const err=validarPaso(S.wstep,S.wizard); if(err) return $('#wErr').textContent=err;
    if(S.wstep<WSTEPS.length-1){ S.wstep++; render(); return; }
    btn.disabled=true; await terminarWizard(); btn.disabled=false; return;
  }
  if(f.id==='fCons'){ const cons=leerConsentimiento('#cErr'); if(!cons) return; btn.disabled=true; if(await guardarCli(cons)) toast('Gracias. Ya puedes seguir.'); btn.disabled=false; return; }
  if(f.id==='fCentro'){ btn.disabled=true; await guardarCentro({nombre:$('#ceNombre').value.trim(), nif:$('#ceNif').value.trim(), direccion:$('#ceDir').value.trim(), email:$('#ceMail').value.trim(), bizum:$('#ceBizum').value.trim()},'Datos del centro guardados'); btn.disabled=false; return; }
  if(f.id==='fTarifas'){
    leerTarifas(); const num=v=>parseFloat(String(v).replace(',','.'));
    const L=S.tarEdit.map(x=>({id:x.id, n:String(x.n).trim(), meses:parseInt(x.meses,10), precio:Math.round(num(x.precio)*100)/100}));
    const errT=m=>{ const e=$('#tErr'); if(e){ e.textContent=m; e.scrollIntoView({block:'center', behavior:'smooth'}); } toast(m); };
    if(!L.length) return errT('Deja al menos una tarifa.');
    const mal=L.findIndex(x=>!x.n || !(x.meses>=1&&x.meses<=36) || !(x.precio>=0&&x.precio<10000));
    if(mal>=0) return errT(`No se ha guardado: revisa la tarifa ${mal+1} (nombre, duración de 1 a 36 meses y precio).`);
    const on=$('#tPrueba').checked, dias=parseInt($('#tDias').value,10);
    if(on && !(dias>=1&&dias<=60)) return errT('No se ha guardado: los días de prueba deben estar entre 1 y 60.');
    const borradas={...(S.centro?.tarifasBorradas||{})}; for(const x of tarifas()) if(!L.some(y=>y.id===x.id)) borradas[x.id]=x.n;
    btn.disabled=true; if(await guardarCentro({tarifas:L, pruebaActiva:on, ...(on?{diasPrueba:dias}:{}), tarifasBorradas:borradas},'Tarifas guardadas')) S.tarEdit=null; btn.disabled=false; render(); return; }
  if(f.id==='fOferta'){
    const n=v=>parseFloat(String(v).replace(',','.'));
    const o={activa:$('#ofActiva').checked, nombre:$('#ofNombre').value.trim()||OFERTA_DEF.nombre, precio:Math.round(n($('#ofPrecio').value)*100)/100, meses:parseInt($('#ofMeses').value,10), plazas:parseInt($('#ofPlazas').value,10), usadas:parseInt($('#ofUsadas').value,10)||0};
    const err=m=>{ $('#ofErr').textContent=m; toast(m); };
    if(!(o.precio>=0)) return err('No se ha guardado: revisa el precio.');
    if(!(o.meses>=1&&o.meses<=12)) return err('No se ha guardado: la duración debe estar entre 1 y 12 meses.');
    if(!(o.plazas>=1&&o.plazas<=1000)) return err('No se ha guardado: revisa las plazas en total.');
    if(!(o.usadas>=0&&o.usadas<=o.plazas)) return err('No se ha guardado: las plazas ocupadas no pueden ser más que el total.');
    btn.disabled=true; await guardarCentro({oferta:o},'Oferta guardada'); btn.disabled=false; render(); return; }
  if(f.id==='fFaqs'){ leerFaqs(); const l=S.faqEdit.map(x=>({q:x.q.trim(),a:x.a.trim()})).filter(x=>x.q&&x.a); btn.disabled=true; if(await guardarCentro({faqs:l},'Preguntas guardadas')) S.faqEdit=null; btn.disabled=false; return; }
  if(f.id==='fPrecios'){
    const precios={...(S.centro?.precios||{})}; let mal=null;
    document.querySelectorAll('[data-precio]').forEach(i=>{ const v=parseFloat(String(i.value).replace(',','.')); if(!(v>=0&&v<1000)) mal=ING[i.dataset.precio].n; else if(Math.abs(v-ING[i.dataset.precio].pr)<0.005) delete precios[i.dataset.precio]; else precios[i.dataset.precio]=Math.round(v*100)/100; });
    if(mal) return $('#prErr').textContent='Revisa el precio de '+mal+'.';
    btn.disabled=true; await guardarCentro({precios, preciosFecha:hoy()},'Precios guardados'); btn.disabled=false; return; }
  if(f.id==='fMed'){ btn.disabled=true; await guardarMedicion(); btn.disabled=false; return; }
  if(f.id==='fPerfil'){ btn.disabled=true; await guardarPerfil(); btn.disabled=false; return; }
});

if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body>
</html>
